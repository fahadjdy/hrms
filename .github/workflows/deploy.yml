name: deploy

# Builds the frontend and uploads the application to hrms.fahad-jadiya.com over
# explicit FTPS. The `vendor` folder is not uploaded: after a deploy that
# changes composer.lock, run `composer install --no-dev --optimize-autoloader`
# on the server. The server's own `.env` is never touched.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits for the running upload to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # PHP dependencies are only needed here so the build can run: the
      # Wayfinder Vite plugin calls `php artisan` to generate the route helpers.
      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Prepare build environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.fahad-jadiya.com
          username: fahadja2
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # The folder the application lives in, relative to the FTP login
          # directory. Override it with a repository variable named
          # FTP_SERVER_DIR if the domain uses a different folder.
          server-dir: ${{ vars.FTP_SERVER_DIR || './hrms.fahad-jadiya.com/' }}
          # `.gitignore` placeholders are uploaded on purpose: they create the
          # empty storage and cache folders Laravel needs on the server.
          exclude: |
            **/.git/**
            .gitattributes
            **/node_modules/**
            vendor/**
            .env
            .env.*
            .ai/**
            .claude/**
            .github/**
            .mcp.json
            CLAUDE.md
            AGENTS.md
            README.md
            docs/**
            boost.json
            skills-lock.json
            dev.bat
            tests/**
            phpunit.xml
            phpstan.neon
            pint.json
            bootstrap/cache/*.php
            public/hot
            public/storage
            resources/js/**
            resources/css/**
            storage/logs/*.log
            storage/framework/views/*.php
            database/*.sqlite

      # Creates any missing storage and cache folders on the server and drops
      # the caches left over from the previous release. It never touches the
      # database: run /deploy/migrate yourself when a release adds migrations.
      # This cannot work until `vendor` and `.env` exist on the server, so a
      # failure here is reported but does not fail the deploy.
      - name: Prepare the server
        continue-on-error: true
        env:
          APP_URL: ${{ vars.APP_URL || 'https://hrms.fahad-jadiya.com' }}
        run: |
          for task in setup clear; do
            echo "::group::/deploy/$task"
            code=$(curl --silent --show-error --max-time 120 --output response.txt --write-out '%{http_code}' "$APP_URL/deploy/$task" || true)
            cat response.txt 2>/dev/null || true
            echo
            echo "HTTP $code"
            echo "::endgroup::"
            if [ "$code" != "200" ]; then
              echo "::warning::/deploy/$task answered HTTP $code. Open $APP_URL/deploy in a browser once vendor and .env are on the server."
            fi
            # The deploy URLs refuse to run twice within five seconds.
            sleep 6
          done
